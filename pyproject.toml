[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-reliability"
version = "0.2.0"
description = "Local CSV checks for silent data-quality failures"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
pipeline-reliability = "pipeline_reliability.cli:main"

[tool.setuptools]
packages = ["pipeline_reliability"]
py-modules = ["reliability_kit"]
