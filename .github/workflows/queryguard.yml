name: QueryGuard overlap-aware planning
on:
  push:
    branches: [feature/queryguard-overlap-planner]
  pull_request:
    branches: [research/queryguard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s research/queryguard/tests -v
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m research.queryguard.overlap_v1.experiment --output /tmp/queryguard-evidence
      - run: python -m research.queryguard.overlap_v1.verify /tmp/queryguard-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: queryguard-evidence
          path: /tmp/queryguard-evidence/
