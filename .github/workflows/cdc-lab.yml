name: CDC replay experiment lab
on:
  push:
    branches: [research/paper2-cdc-replay-lab]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python research/test_paper_experiments_v4.py
      - run: python research/test_paper_experiments_v5.py
      - run: python research/cdc_lab/run.py --output /tmp/cdc-lab-ci
      - uses: actions/upload-artifact@v4
        with:
          name: cdc-replay-experiment
          path: /tmp/cdc-lab-ci/
